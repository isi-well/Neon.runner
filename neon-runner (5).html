let topRuns = [];
let notifications = [];

let worldTitleTimer = 0, worldTitleText = '', maxWorldThisRun = 0;

let obstacles = [], coins = [];
let shopBtn = null, goalsBtn = null, backBtn = null, leftBtn = null, rightBtn = null, cardBtn = null;

// ==================== LOCALSTORAGE ====================
function loadData() {
  try {
    const raw = localStorage.getItem('neonRunnerData');
    if (raw) {
      const data = JSON.parse(raw);
      highScore = data.highScore || 0;
      coinsWallet = data.coins || 0;
      ownedSkins = new Set(data.owned || ['default']);
      selectedSkin = data.selected || 'default';
      if (!ownedSkins.has(selectedSkin)) selectedSkin = 'default';
      if (typeof data.soundEnabled === 'boolean') soundEnabled = data.soundEnabled;
      if (data.stats) stats = Object.assign(stats, data.stats);
      if (data.unlocked) unlockedAchievements = new Set(data.unlocked);
      if (data.topRuns) topRuns = data.topRuns;
      if (data.dailyDate) dailyDate = data.dailyDate;
      if (data.dailyQuests) dailyQuests = data.dailyQuests;
      if (data.dailyProgress) dailyProgress = data.dailyProgress;
    }
  } catch (e) {
    highScore = 0; coinsWallet = 0; ownedSkins = new Set(['default']); selectedSkin = 'default'; soundEnabled = true;
  }
  ensureDailyQuests();
}

function saveData() {
  try {
    localStorage.setItem('neonRunnerData', JSON.stringify({
      highScore, coins: coinsWallet, owned: Array.from(ownedSkins), selected: selectedSkin,
      soundEnabled, stats, unlocked: Array.from(unlockedAchievements), topRuns,
      dailyDate, dailyQuests, dailyProgress
    }));
  } catch (e) {}
}

window.addEventListener('beforeunload', saveData);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveData(); });

// ==================== ЕЖЕДНЕВНЫЕ ЗАДАНИЯ ====================
function getLocalDateStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function seededShuffle(arr, seed) {
  const a = arr.slice();
  let s = seed;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 16807) % 2147483647;
    const j = s % (i + 1);
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function ensureDailyQuests() {
  const today = getLocalDateStr();
  if (dailyDate === today && dailyQuests.length === 3) return;
  dailyDate = today;
  const seed = today.split('-').reduce(function(a, b) { return a + parseInt(b, 10); }, 0) * 31;
  const shuffled = seededShuffle(DAILY_POOL, seed);
  dailyQuests = shuffled.slice(0, 3).map(function(q) { return Object.assign({}, q, { done: false }); });
  dailyProgress = {};
  dailyQuests.forEach(function(q) { dailyProgress[q.id] = 0; });
  saveData();
}

function getDailyProgress(q) { return dailyProgress[q.id] || 0; }

// ==================== ДОСТИЖЕНИЯ ====================
function pushNotify(text) { notifications.push({ text: text, life: 3 }); }

function unlockAchievement(ach) {
  if (unlockedAchievements.has(ach.id)) return;
  unlockedAchievements.add(ach.id);
  coinsWallet += ach.reward;
  pushNotify('Достижение: ' + ach.name + ' +' + ach.reward + ' монет');
  saveData();
}

function checkAchievements() {
  ACHIEVEMENTS.forEach(function(ach) {
    if (unlockedAchievements.has(ach.id)) return;
    var val = 0;
    if (ach.type === 'runScore') val = score;
    else if (ach.type === 'runCoins') val = runCoins;
    else if (ach.type === 'totalCoins') val = stats.totalCoins;
    else if (ach.type === 'totalJumps') val = stats.totalJumps;
    else if (ach.type === 'totalRuns') val = stats.totalRuns;
    else if (ach.type === 'skins') val = ownedSkins.size - 1;
    if (val >= ach.target) unlockAchievement(ach);
  });
}

function checkDailyQuests() {
  ensureDailyQuests();
  dailyQuests.forEach(function(q) {
    if (q.done) return;
    var val = getDailyProgress(q);
    if (q.type === 'dayBestScore') val = Math.max(val, score);
    if (q.type === 'dayWorld') val = Math.max(val, maxWorldThisRun + 1);
    dailyProgress[q.id] = val;
    if (val >= q.target) {
      q.done = true;
      coinsWallet += q.reward;
      pushNotify('Задание: ' + q.name + ' +' + q.reward + ' монет');
      saveData();
    }
  });
}

function addTopRun(sc) {
  var d = new Date();
  var dateStr = String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
  topRuns.push({ score: sc, date: dateStr });
  topRuns.sort(function(a, b) { return b.score - a.score; });
  topRuns = topRuns.slice(0, 5);
  saveData();
}

function getTopPlace(sc) {
  for (var i = 0; i < topRuns.length; i++) if (topRuns[i].score === sc) return i + 1;
  return 0;
}

// ==================== AUDIO ====================
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
}

function playSound(name) {
  if (!soundEnabled || !audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  var now = audioCtx.currentTime;
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  if (name === 'jump') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(280, now);
    osc.frequency.exponentialRampToValueAtTime(420, now + 0.08);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.start(now); osc.stop(now + 0.13);
  } else if (name === 'doubleJump') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(360, now);
    osc.frequency.exponentialRampToValueAtTime(520, now + 0.07);
    gain.gain.setValueAtTime(0.11, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
    osc.start(now); osc.stop(now + 0.12);
  } else if (name === 'coin') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.exponentialRampToValueAtTime(1320, now + 0.06);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.start(now); osc.stop(now + 0.16);
  } else if (name === 'crash') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.start(now); osc.stop(now + 0.32);
  } else if (name === 'worldChange') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.exponentialRampToValueAtTime(660, now + 0.2);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc.start(now); osc.stop(now + 0.36);
  }
}

function startMusic() {
  if (!audioCtx || !soundEnabled || musicPlaying) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  var master = audioCtx.createGain(); master.gain.value = 0.06; master.connect(audioCtx.destination);
  var bass = audioCtx.createOscillator(); bass.type = 'triangle'; bass.frequency.value = 55;
  var bassGain = audioCtx.createGain(); bassGain.gain.value = 0.7;
  bass.connect(bassGain); bassGain.connect(master); bass.start();
  var beatOsc = audioCtx.createOscillator(); beatOsc.type = 'square'; beatOsc.frequency.value = 200;
  var beatGain = audioCtx.createGain(); beatGain.gain.value = 0;
  beatOsc.connect(beatGain); beatGain.connect(master); beatOsc.start();
  musicNodes = { master: master, bass: bass, bassGain: bassGain, beatOsc: beatOsc, beatGain: beatGain };
  musicPlaying = true; beatTimer = 0;
}

function stopMusic() {
  if (!musicNodes) return;
  try { musicNodes.bass.stop(); musicNodes.beatOsc.stop(); musicNodes.master.disconnect(); } catch (e) {}
  musicNodes = null; musicPlaying = false;
}

function updateMusic(dt) {
  if (!musicPlaying || !musicNodes || !soundEnabled) return;
  var tempo = 2.2 + (speed - CFG.baseSpeed) / (CFG.maxSpeed - CFG.baseSpeed) * 2.5;
  beatTimer += dt * tempo;
  if (beatTimer >= 1) {
    beatTimer -= 1;
    var now = audioCtx.currentTime;
    musicNodes.beatGain.gain.cancelScheduledValues(now);
    musicNodes.beatGain.gain.setValueAtTime(0.5, now);
    musicNodes.beatGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    if (Math.random() < 0.4) musicNodes.bass.frequency.setValueAtTime(55 + Math.random() * 20, now);
  }
}

function pauseMusic() { if (musicNodes && musicNodes.master) musicNodes.master.gain.value = 0; }
function resumeMusic() { if (musicNodes && musicNodes.master && soundEnabled) musicNodes.master.gain.value = 0.06; }

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
function resize() {
  W = canvas.width = window.innerWidth;

  player.x = W * 0.18;
  if (state === 'start' || state === 'gameover' || state === 'shop' || state === 'goals') player.y = groundY - player.h;
}
window.addEventListener('resize', resize);

loadData();

function initStarsForWorld(world) {
  stars = [];
  for (var i = 0; i < (world.starCount || 90); i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * groundY * 0.75, r: Math.random() * 1.6 + 0.4, a: Math.random() * 0.6 + 0.3, tw: Math.random() * Math.PI * 2 });
  }
}

function initMountainsForWorld(world) {
  mountains = [
    { speed: 0.12, color: world.mountains[0], peaks: [] },
    { speed: 0.28, color: world.mountains[1], peaks: [] },
    { speed: 0.55, color: world.mountains[2], peaks: [] }
  ];
  mountains.forEach(function(m) {
    var x = -100;
    while (x < W + 400) {
      m.peaks.push({ x: x, h: 40 + Math.random() * 90, w: 80 + Math.random() * 140 });
      x += 60 + Math.random() * 100;
    }
  });
}

function lerpColor(a, b, t) {
  function parse(c) {
    if (c.indexOf('rgba') === 0 || c.indexOf('rgb') === 0) {
      var m = c.match(/[\d.]+/g);
      return m ? m.map(Number) : [0, 0, 0, 1];
    }
    var h = c.replace('#', '');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  var ca = parse(a), cb = parse(b);
  var r = Math.round(ca[0] + (cb[0] - ca[0]) * t);
  var g = Math.round(ca[1] + (cb[1] - ca[1]) * t);
  var b_ = Math.round(ca[2] + (cb[2] - ca[2]) * t);
  if (ca.length > 3 || cb.length > 3) {
    var aa = ca[3] !== undefined ? ca[3] : 1, ab = cb[3] !== undefined ? cb[3] : 1;
    return 'rgba(' + r + ',' + g + ',' + b_ + ',' + (aa + (ab - aa) * t) + ')';
  }
  return '#' + r.toString(16).padStart(2, '0') + g.toString(16).padStart(2, '0') + b_.toString(16).padStart(2, '0');
}

function getCurrentWorldColors() {
  var from = WORLDS[currentWorldIndex], to = WORLDS[targetWorldIndex], t = worldTransition;
  return {
    sky: [lerpColor(from.sky[0], to.sky[0], t), lerpColor(from.sky[1], to.sky[1], t), lerpColor(from.sky[2], to.sky[2], t)],
    mountains: [lerpColor(from.mountains[0], to.mountains[0], t), lerpColor(from.mountains[1], to.mountains[1], t), lerpColor(from.mountains[2], to.mountains[2], t)],
    ground: [lerpColor(from.ground[0], to.ground[0], t), lerpColor(from.ground[1], to.ground[1], t), lerpColor(from.ground[2], to.ground[2], t)],
    horizon: lerpColor(from.horizon, to.horizon, t),
    stripe: lerpColor(from.stripe, to.stripe, t),
    obstacleLow: lerpColor(from.obstacleLow, to.obstacleLow, t),
    obstacleHigh: lerpColor(from.obstacleHigh, to.obstacleHigh, t),
    obstacleFly: [lerpColor(from.obstacleFly[0], to.obstacleFly[0], t), lerpColor(from.obstacleFly[1], to.obstacleFly[1], t)]
  };
}

initStarsForWorld(WORLDS[0]);
initMountainsForWorld(WORLDS[0]);

// ==================== УПРАВЛЕНИЕ ====================
var keys = {};
window.addEventListener('keydown', function(e) {
  keys[e.code] = true;
  initAudio();
  if (e.repeat && (e.code === 'Space' || e.code === 'ArrowUp')) return;
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (state === 'start') startGame();
    else if (state === 'gameover') { if (performance.now() - deathTime >= 500) startGame(); }
    else if (state === 'playing') jump();
    else if (state === 'shop') tryBuyOrSelect();
  }
  if (e.code === 'KeyS' && (state === 'start' || state === 'gameover')) openShop();
  if (e.code === 'KeyG' && (state === 'start' || state === 'gameover')) openGoals();
  if (e.code === 'KeyM') {
    soundEnabled = !soundEnabled; saveData();
    if (!soundEnabled) stopMusic(); else if (state === 'playing') startMusic();
  }
  if (e.code === 'Escape') {
    if (state === 'shop' || state === 'goals') { state = goalsFrom || 'start'; shopMessage = ''; }
    else if (state === 'playing' || state === 'paused') {
      state = state === 'playing' ? 'paused' : 'playing';
      if (state === 'paused') pauseMusic(); else resumeMusic();
    }
  }
  if (e.code === 'KeyP' && (state === 'playing' || state === 'paused')) {
    state = state === 'playing' ? 'paused' : 'playing';
    if (state === 'paused') pauseMusic(); else resumeMusic();
  }
  if (state === 'shop') {
    if (e.code === 'ArrowLeft') shopIndex = (shopIndex - 1 + SKINS.length) % SKINS.length;
    if (e.code === 'ArrowRight') shopIndex = (shopIndex + 1) % SKINS.length;
    if (e.code === 'Enter') tryBuyOrSelect();
  }
  if (state === 'goals') {
    if (e.code === 'ArrowLeft') goalsTab = (goalsTab - 1 + 3) % 3;
    if (e.code === 'ArrowRight') goalsTab = (goalsTab + 1) % 3;
  }
});
window.addEventListener('keyup', function(e) { keys[e.code] = false; });
window.addEventListener('wheel', function(e) {
  if (state === 'goals') { goalsScroll += e.deltaY * 0.5; goalsScroll = Math.max(0, goalsScroll); }
}, { passive: true });

var touchScrollY = 0;
canvas.addEventListener('touchmove', function(e) {
  if (state === 'goals' && e.touches.length) {
    var dy = touchScrollY - e.touches[0].clientY;
    goalsScroll += dy; goalsScroll = Math.max(0, goalsScroll);
    touchScrollY = e.touches[0].clientY;
  }
}, { passive: true });

function getPos(e) {
  if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}
function hitRect(px, py, r) { return r && px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h; }

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault(); initAudio();
  if (e.touches.length) touchScrollY = e.touches[0].clientY;
  var pos = getPos(e); handlePointer(pos.x, pos.y);
}, { passive: false });
canvas.addEventListener('mousedown', function(e) {
  initAudio(); var pos = getPos(e); handlePointer(pos.x, pos.y);
});

function handlePointer(px, py) {
  if (state === 'start') {
    if (hitRect(px, py, shopBtn)) { openShop(); return; }
    if (hitRect(px, py, goalsBtn)) { openGoals(); return; }
    startGame(); return;
  }
  if (state === 'gameover') {
    if (hitRect(px, py, gameOverShopBtn)) { openShop(); return; }
    if (hitRect(px, py, gameOverGoalsBtn)) { openGoals(); return; }
    if (performance.now() - deathTime >= 500) startGame(); return;
  }
  if (state === 'playing') { jump(); return; }
  if (state === 'shop') {
    if (hitRect(px, py, backBtn)) { state = 'start'; shopMessage = ''; return; }
    if (hitRect(px, py, leftBtn)) { shopIndex = (shopIndex - 1 + SKINS.length) % SKINS.length; return; }
    if (hitRect(px, py, rightBtn)) { shopIndex = (shopIndex + 1) % SKINS.length; return; }
    if (hitRect(px, py, cardBtn)) { tryBuyOrSelect(); return; }
  }
  if (state === 'goals') {
    if (hitRect(px, py, backBtn)) { state = goalsFrom || 'start'; return; }
    for (var i = 0; i < tabBtns.length; i++) if (hitRect(px, py, tabBtns[i])) { goalsTab = i; goalsScroll = 0; return; }
  }
}

// ==================== ИГРОВАЯ ЛОГИКА ====================
function openShop() {
  goalsFrom = state; state = 'shop';
  shopIndex = SKINS.findIndex(function(s) { return s.id === selectedSkin; });
  if (shopIndex < 0) shopIndex = 0; shopMessage = '';
}
function openGoals() {
  ensureDailyQuests(); goalsFrom = state; state = 'goals'; goalsTab = 0; goalsScroll = 0;
}

function tryBuyOrSelect() {
  var skin = SKINS[shopIndex];
  if (ownedSkins.has(skin.id)) {
    selectedSkin = skin.id; saveData(); shopMessage = 'Выбрано'; shopMessageTimer = 1.2;
  } else if (coinsWallet >= skin.price) {
    coinsWallet -= skin.price; ownedSkins.add(skin.id); selectedSkin = skin.id;
    saveData(); shopMessage = 'Куплено!'; shopMessageTimer = 1.2; checkAchievements();
  } else { shopMessage = 'Не хватает монет'; shopMessageTimer = 1.5; }
}

function getSkin() { return SKINS.find(function(s) { return s.id === selectedSkin; }) || SKINS[0]; }
function getNextUnownedSkin() { return SKINS.find(function(s) { return s.price > 0 && !ownedSkins.has(s.id); }) || null; }

function startGame() {
  ensureDailyQuests();
  state = 'playing'; score = 0; bonusScore = 0; runCoins = 0; runJumps = 0; distance = 0;
  speed = CFG.baseSpeed; obstacles = []; coins = []; particles = [];
  spawnTimer = 0; nextSpawn = 1.2;
  player.y = groundY - player.h; player.vy = 0; player.onGround = true; player.jumpsLeft = 2;
  player.runFrame = 0; player.h = 52; gameTime = 0; maxWorldThisRun = 0;
  currentWorldIndex = 0; targetWorldIndex = 0; worldTransition = 1; worldTitleTimer = 0;
  initStarsForWorld(WORLDS[0]); initMountainsForWorld(WORLDS[0]);
  stats.totalRuns++;
  dailyQuests.forEach(function(q) { if (q.type === 'dayRuns') dailyProgress[q.id] = (dailyProgress[q.id] || 0) + 1; });
  saveData(); startMusic();
}

function jump() {
  if (player.jumpsLeft > 0) {
    var isFirst = player.jumpsLeft === 2;
    player.vy = isFirst ? CFG.jumpForce : CFG.doubleJumpForce;
    player.onGround = false; player.jumpsLeft--;
    runJumps++; stats.totalJumps++;
    dailyQuests.forEach(function(q) { if (q.type === 'dayJumps') dailyProgress[q.id] = (dailyProgress[q.id] || 0) + 1; });
    playSound(isFirst ? 'jump' : 'doubleJump');
  }
}

function lastGroundObstacleX() {
  var maxX = -Infinity;
  for (var i = 0; i < obstacles.length; i++) if (obstacles[i].type !== 'fly' && obstacles[i].x > maxX) maxX = obstacles[i].x;
  return maxX;
}

function spawnObstacle() {
  var r = Math.random(), type, h, w;
  if (r < 0.38) { type = 'low'; w = 28 + Math.random() * 18; h = 32 + Math.random() * 20; }
  else if (r < 0.68) { type = 'high'; w = 34 + Math.random() * 16; h = 78 + Math.random() * 30; }
  else { type = 'fly'; w = 44 + Math.random() * 20; h = 22 + Math.random() * 10; }
  if (type === 'fly') {
    var lastGround = lastGroundObstacleX();
    if (lastGround > -Infinity && (W + 40 - lastGround) < 350) {
      type = 'low'; w = 28 + Math.random() * 18; h = 32 + Math.random() * 20;
    }
  }
  var baseClearance = 0, bobAmp = 0;
  if (type === 'fly') { baseClearance = 68 + Math.random() * 12; bobAmp = 5 + Math.random() * 3; }
  var y = type === 'fly' ? groundY - h - baseClearance : groundY - h;
  obstacles.push({ x: W + 40, y: y, w: w, h: h, type: type, baseClearance: baseClearance, bobAmp: bobAmp, bobPhase: Math.random() * Math.PI * 2 });
}

function spawnCoin(nearFly) {
  var cy = nearFly ? groundY - (20 + Math.random() * 30) : groundY - 70 - Math.random() * 90;
  coins.push({ x: W + 30, y: cy, r: 11, collected: false });
}

function checkWorldChange() {
  var desired = Math.floor(score / 2000) % WORLDS.length;
  if (desired !== targetWorldIndex) {
    currentWorldIndex = targetWorldIndex; targetWorldIndex = desired; worldTransition = 0;
    worldTitleText = 'Мир ' + (desired + 1) + ': ' + WORLDS[desired].name;
    worldTitleTimer = 2.5; playSound('worldChange');
    maxWorldThisRun = Math.max(maxWorldThisRun, desired);
    stats.bestWorld = Math.max(stats.bestWorld, desired);
    setTimeout(function() {
      initStarsForWorld(WORLDS[targetWorldIndex]);
      initMountainsForWorld(WORLDS[targetWorldIndex]);
    }, 1200);
  }
}

function endRun() {
  stats.totalCoins += runCoins;
  if (runCoins > stats.bestRunCoins) stats.bestRunCoins = runCoins;
  addTopRun(score);
  checkAchievements();
  checkDailyQuests();
  saveData();
}

function update(dt) {
  gameTime += dt;
  notifications.forEach(function(n) { n.life -= dt; });
  notifications = notifications.filter(function(n) { return n.life > 0; });
  if (state === 'shop' && shopMessageTimer > 0) { shopMessageTimer -= dt; if (shopMessageTimer <= 0) shopMessage = ''; }
  if (worldTransition < 1) {
    worldTransition = Math.min(1, worldTransition + dt / 2);
    if (worldTransition >= 1) currentWorldIndex = targetWorldIndex;
  }
  if (worldTitleTimer > 0) worldTitleTimer -= dt;
  if (state !== 'playing') return;
  updateMusic(dt);
  speed = Math.min(CFG.maxSpeed, speed + CFG.speedIncrease * dt);
  distance += speed * dt;
  score = Math.floor(distance / 10) + bonusScore;
  checkWorldChange();
  player.vy += CFG.gravity * dt; player.y += player.vy * dt; player.h = 52;
  if (player.y + player.h >= groundY) {
    player.y = groundY - player.h; player.vy = 0;
    if (!player.onGround) {
      for (var i = 0; i < 8; i++) {
        particles.push({ x: player.x + player.w * 0.5, y: groundY - 2, vx: (Math.random() - 0.5) * 120, vy: -Math.random() * 80 - 20, life: 0.4 + Math.random() * 0.3, max: 0.7, color: 'rgba(180,220,255,0.7)' });
      }
    }
    player.onGround = true; player.jumpsLeft = 2;
  } else player.onGround = false;
  player.runFrame += dt * (speed / 40);
  var skin = getSkin();
  if (skin.trail) {
    var rate = skin.trail.rate || 12;
    if (Math.random() < rate * dt) {
      var col = skin.trail.colors[Math.floor(Math.random() * skin.trail.colors.length)];
      particles.push({ x: player.x + player.w * 0.2 + Math.random() * 6, y: player.y + player.h * 0.5 + (Math.random() - 0.5) * 16, vx: -40 - Math.random() * 60, vy: (Math.random() - 0.5) * 40, life: 0.35 + Math.random() * 0.25, max: 0.6, color: col });
    }
  }
  spawnTimer += dt;
  if (spawnTimer >= nextSpawn) {
    spawnObstacle();
    var just = obstacles[obstacles.length - 1];
    if (Math.random() < CFG.coinChance) spawnCoin(just && just.type === 'fly');
    spawnTimer = 0;
    nextSpawn = CFG.spawnIntervalMin + Math.random() * (CFG.spawnIntervalMax - CFG.spawnIntervalMin);
    nextSpawn *= Math.max(0.55, 1 - (speed - CFG.baseSpeed) / (CFG.maxSpeed * 1.4));
  }
  var move = speed * dt;
  obstacles.forEach(function(o) {
    o.x -= move;
    if (o.type === 'fly') {
      var bob = Math.sin(gameTime * 2.2 + o.bobPhase) * o.bobAmp;
      o.y = groundY - o.h - Math.max(62, o.baseClearance + bob);
    }
  });
  coins.forEach(function(c) { c.x -= move; });
  obstacles = obstacles.filter(function(o) { return o.x + o.w > -20; });
  coins = coins.filter(function(c) { return c.x > -30 && !c.collected; });
  var s = CFG.hitboxShrink;
  var px = player.x + player.w * s, py = player.y + player.h * s * 0.5;
  var pw = player.w * (1 - 2 * s), ph = player.h * (1 - s);
  for (var oi = 0; oi < obstacles.length; oi++) {
    var o = obstacles[oi];
    var ox = o.x + o.w * s * 0.5, oy = o.y + o.h * s * 0.3;
    var ow = o.w * (1 - s), oh = o.h * (1 - s * 0.6);
    if (px < ox + ow && px + pw > ox && py < oy + oh && py + ph > oy) {
      state = 'gameover'; deathTime = performance.now();
      if (score > highScore) highScore = score;
      playSound('crash'); stopMusic(); endRun(); return;
    }
  }
  for (var ci = 0; ci < coins.length; ci++) {
    var c = coins[ci];
    if (c.collected) continue;
    var dx = (player.x + player.w / 2) - c.x, dy = (player.y + player.h / 2) - c.y;
    if (dx * dx + dy * dy < (c.r + 18) * (c.r + 18)) {
      c.collected = true; bonusScore += 25; runCoins += CFG.coinValue; coinsWallet += CFG.coinValue;
      dailyQuests.forEach(function(q) { if (q.type === 'dayCoins') dailyProgress[q.id] = (dailyProgress[q.id] || 0) + CFG.coinValue; });
      saveData(); playSound('coin');
      for (var pi = 0; pi < 12; pi++) {
        var a = Math.random() * Math.PI * 2;
        particles.push({ x: c.x, y: c.y, vx: Math.cos(a) * (60 + Math.random() * 100), vy: Math.sin(a) * (60 + Math.random() * 100), life: 0.5 + Math.random() * 0.3, max: 0.8, color: 'hsla(' + (40 + Math.random() * 20) + ',100%,65%,0.9)' });
      }
    }
  }
  particles.forEach(function(p) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; });
  particles = particles.filter(function(p) { return p.life > 0; });
  mountains.forEach(function(m) {
    m.peaks.forEach(function(p) {
      p.x -= move * m.speed;
      if (p.x + p.w < -50) p.x += W + 300 + Math.random() * 100;
    });
  });
}

// ==================== ОТРИСОВКА (сокращённо ключевые функции) ====================
function drawBackground() {
  var colors = getCurrentWorldColors();
  var g = ctx.createLinearGradient(0, 0, 0, groundY);
  g.addColorStop(0, colors.sky[0]); g.addColorStop(0.4, colors.sky[1]); g.addColorStop(1, colors.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  stars.forEach(function(s) {
    s.tw += 0.03; var a = s.a * (0.6 + 0.4 * Math.sin(s.tw));
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(200,220,255,' + a + ')'; ctx.fill();
  });
  mountains.forEach(function(m, i) {
    ctx.fillStyle = colors.mountains[i] || m.color;
    ctx.beginPath(); ctx.moveTo(-50, groundY);
    m.peaks.forEach(function(p) {
      ctx.lineTo(p.x, groundY - p.h); ctx.lineTo(p.x + p.w * 0.5, groundY - p.h * 0.4); ctx.lineTo(p.x + p.w, groundY - p.h * 0.85);
    });
    ctx.lineTo(W + 50, groundY); ctx.closePath(); ctx.fill();
  });
  var groundGrad = ctx.createLinearGradient(0, groundY, 0, H);
  groundGrad.addColorStop(0, colors.ground[0]); groundGrad.addColorStop(0.15, colors.ground[1]); groundGrad.addColorStop(1, colors.ground[2]);
  ctx.fillStyle = groundGrad; ctx.fillRect(0, groundY, W, H - groundY);
  ctx.strokeStyle = colors.horizon; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
  ctx.strokeStyle = colors.stripe; ctx.lineWidth = 1;
  var stripe = ((distance * 0.4) % 60);
  for (var x = -stripe; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, groundY + 8); ctx.lineTo(x + 30, groundY + 8); ctx.stroke(); }
}

function drawHat(skin, scale) {
  if (!skin.hat || skin.hat === 'none' || !skin.hatColors) return;
  var hc = skin.hatColors, headY = -52 * scale * 0.42, headR = 13 * scale;
  ctx.save();
  if (skin.hat === 'horns') {
    var hornH = 14 * scale;
    ctx.fillStyle = hc.primary;
    ctx.beginPath();
    ctx.moveTo(-headR * 0.55, headY - headR * 0.3);
    ctx.quadraticCurveTo(-headR * 0.9, headY - headR - hornH * 0.6, -headR * 0.35, headY - headR - hornH);
    ctx.quadraticCurveTo(-headR * 0.15, headY - headR * 0.7, -headR * 0.25, headY - headR * 0.25);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(headR * 0.55, headY - headR * 0.3);
    ctx.quadraticCurveTo(headR * 0.9, headY - headR - hornH * 0.6, headR * 0.35, headY - headR - hornH);
    ctx.quadraticCurveTo(headR * 0.15, headY - headR * 0.7, headR * 0.25, headY - headR * 0.25);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = hc.secondary;
    ctx.beginPath(); ctx.arc(-headR * 0.38, headY - headR - hornH + 2 * scale, 2.2 * scale, 0, Math.PI * 2);
    ctx.arc(headR * 0.38, headY - headR - hornH + 2 * scale, 2.2 * scale, 0, Math.PI * 2); ctx.fill();
  } else if (skin.hat === 'tophat') {
    var brimW = headR * 1.7, brimH = 3.5 * scale, cylW = headR * 1.15, cylH = 16 * scale, topY = headY - headR - 1 * scale;
    ctx.fillStyle = hc.brim || hc.primary; ctx.beginPath(); ctx.ellipse(0, topY, brimW, brimH, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = hc.primary; ctx.fillRect(-cylW / 2, topY - cylH, cylW, cylH);
    ctx.beginPath(); ctx.ellipse(0, topY - cylH, cylW / 2, 2.5 * scale, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = hc.band; ctx.fillRect(-cylW / 2, topY - 5 * scale, cylW, 4 * scale);
  } else if (skin.hat === 'crown') {
    var baseY = headY - headR + 2 * scale, crownH = 12 * scale, halfW = headR * 0.95;
    ctx.fillStyle = hc.primary;
    ctx.beginPath();
    ctx.moveTo(-halfW, baseY); ctx.lineTo(-halfW, baseY - crownH * 0.45);
    ctx.lineTo(-halfW * 0.65, baseY - crownH * 0.45); ctx.lineTo(-halfW * 0.5, baseY - crownH);
    ctx.lineTo(-halfW * 0.25, baseY - crownH * 0.45); ctx.lineTo(0, baseY - crownH * 0.45);
    ctx.lineTo(0, baseY - crownH); ctx.lineTo(halfW * 0.25, baseY - crownH * 0.45);
    ctx.lineTo(halfW * 0.5, baseY - crownH); ctx.lineTo(halfW * 0.65, baseY - crownH * 0.45);
    ctx.lineTo(halfW, baseY - crownH * 0.45); ctx.lineTo(halfW, baseY); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = hc.secondary; ctx.lineWidth = 1.5 * scale; ctx.stroke();
    [{ x: -halfW * 0.5, c: hc.gem }, { x: 0, c: hc.gem2 }, { x: halfW * 0.5, c: hc.gem }].forEach(function(g) {
      ctx.fillStyle = g.c; ctx.beginPath(); ctx.arc(g.x, baseY - crownH * 0.55, 2.2 * scale, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(g.x - 0.6 * scale, baseY - crownH * 0.55 - 0.5 * scale, 0.8 * scale, 0, Math.PI * 2); ctx.fill();
    });
  }
  ctx.restore();
}

function drawPlayerAt(cx, cy, scale, skinOverride) {
  var skin = skinOverride || getSkin();
  var pw = player.w * scale, ph = 52 * scale;
  ctx.save(); ctx.translate(cx, cy);
  if (skin.glow) {
    var grd = ctx.createRadialGradient(0, 0, 4, 0, 0, skin.glow.radius * scale);
    grd.addColorStop(0, skin.glow.color); grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(0, 0, skin.glow.radius * scale, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(0, ph / 2 + 4 * scale, pw * 0.45, 6 * scale, 0, 0, Math.PI * 2); ctx.fill();
  var bodyGrad = ctx.createLinearGradient(-pw / 2, -ph / 2, pw / 2, ph / 2);
  bodyGrad.addColorStop(0, skin.bodyTop); bodyGrad.addColorStop(1, skin.bodyBottom);
  ctx.fillStyle = bodyGrad; ctx.beginPath(); ctx.roundRect(-pw * 0.28, -ph * 0.35, pw * 0.56, ph * 0.55, 6 * scale); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -ph * 0.42, 13 * scale, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0a0a18'; ctx.beginPath(); ctx.arc(5 * scale, -ph * 0.45, 3.5 * scale, 0, Math.PI * 2); ctx.fill();
  if (skin.id === 'gold') { ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.ellipse(-4 * scale, -ph * 0.48, 4 * scale, 2.5 * scale, -0.4, 0, Math.PI * 2); ctx.fill(); }
  drawHat(skin, scale);
  ctx.strokeStyle = skin.stroke; ctx.lineWidth = 4 * scale; ctx.lineCap = 'round';
  if (player.onGround || scale < 1) {
    var leg = Math.sin(player.runFrame * 2.2) * 0.55;
    ctx.beginPath(); ctx.moveTo(-6 * scale, ph * 0.15); ctx.lineTo((-10 + leg * 14) * scale, ph * 0.48);
    ctx.moveTo(6 * scale, ph * 0.15); ctx.lineTo((10 - leg * 14) * scale, ph * 0.48); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(-5 * scale, ph * 0.15); ctx.lineTo(-8 * scale, ph * 0.42);
    ctx.moveTo(5 * scale, ph * 0.15); ctx.lineTo(8 * scale, ph * 0.42); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(-pw * 0.25, -ph * 0.1); ctx.lineTo(-pw * 0.42, ph * 0.05);
  ctx.moveTo(pw * 0.25, -ph * 0.1); ctx.lineTo(pw * 0.38, -ph * 0.02); ctx.stroke();
  ctx.restore();
}

function drawPlayer() { drawPlayerAt(player.x + player.w / 2, player.y + player.h / 2, 1); }

function drawObstacles() {
  var colors = getCurrentWorldColors();
  obstacles.forEach(function(o) {
    ctx.save();
    if (o.type === 'fly') {
      var g = ctx.createRadialGradient(o.x + o.w / 2, o.y + o.h / 2, 2, o.x + o.w / 2, o.y + o.h / 2, o.w / 2);
      g.addColorStop(0, colors.obstacleFly[0]); g.addColorStop(1, colors.obstacleFly[1]);
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(o.x + o.w / 2, o.y + o.h / 2, o.w / 2, o.h / 2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,150,200,0.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(o.x, o.y + o.h / 2); ctx.lineTo(o.x - 12, o.y + o.h / 2 - 6);
      ctx.moveTo(o.x + o.w, o.y + o.h / 2); ctx.lineTo(o.x + o.w + 12, o.y + o.h / 2 - 6); ctx.stroke();
    } else {
      var col = o.type === 'high' ? colors.obstacleHigh : colors.obstacleLow;
      ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 12;
      ctx.fillRect(o.x + o.w * 0.25, o.y, o.w * 0.5, o.h);
      if (o.h > 45) { ctx.fillRect(o.x, o.y + o.h * 0.3, o.w * 0.35, o.h * 0.18); ctx.fillRect(o.x + o.w * 0.65, o.y + o.h * 0.55, o.w * 0.35, o.h * 0.15); }
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  });
}

function drawCoins() {
  coins.forEach(function(c) {
    if (c.collected) return;
    var t = Date.now() / 400;
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(Math.sin(t) * 0.2);
    ctx.beginPath(); ctx.arc(0, 0, c.r + 4, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,200,50,0.25)'; ctx.fill();
    var g = ctx.createRadialGradient(-3, -3, 1, 0, 0, c.r); g.addColorStop(0, '#ffe566'); g.addColorStop(1, '#ffaa00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffdd44'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(-3, -3, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
}

function drawParticles() {
  particles.forEach(function(p) {
    var a = Math.max(0, p.life / p.max); ctx.globalAlpha = a; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3 * a + 1, 0, Math.PI * 2); ctx.fill();
  });

}

function drawProgressBar(x, y, w, h) {

  ctx.fillStyle = 'rgba(20,30,50,0.7)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 6); ctx.fill();
  if (progress > 0) { ctx.fillStyle = 'rgba(255,200,50,0.85)'; ctx.beginPath(); ctx.roundRect(x + 2, y + 2, (w - 4) * progress, h - 4, 4); ctx.fill(); }
  ctx.fillStyle = 'rgba(220,235,255,0.9)'; ctx.font = '13px Segoe UI, system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(next.name + ': ' + coinsWallet + ' / ' + next.price, x + w / 2, y + h / 2 + 4);
}

function drawNotifications() {

    ctx.fillStyle = 'rgba(200,240,255,' + alpha + ')'; ctx.textAlign = 'center'; ctx.fillText(n.text, W / 2, y + 21);

    ctx.fillText('ПАУЗА', W / 2, H / 2 - 10);
    ctx.font = '18px Segoe UI, system-ui, sans-serif'; ctx.fillStyle = 'rgba(200,220,255,0.8)';

}

function drawStartScreen() {

  var btnW = 150, btnH = 42, gap = 16, totalW = btnW * 2 + gap, startX = W / 2 - totalW / 2, btnY = H * 0.68;

function drawGameOver() {

  else if (place > 0) { ctx.fillStyle = '#7dd3fc'; ctx.font = '16px Segoe UI, system-ui, sans-serif'; ctx.fillText('Место в топе: ' + place, W / 2, H * 0.28 + 78); }

    ctx.fillStyle = 'rgba(30,60,100,0.9)'; ctx.strokeStyle = '#4de8ff'; ctx.lineWidth = 2;

}

function drawShop() {
  drawBackground(); ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = '#4de8ff'; ctx.font = 'bold 32px Segoe UI, system-ui, sans-serif';
  ctx.fillText('МАГАЗИН СКИНОВ', W / 2, Math.max(36, H * 0.06));
  ctx.fillStyle = 'rgba(255,220,100,0.95)'; ctx.font = '16px Segoe UI, system-ui, sans-serif';
  ctx.fillText('Баланс: ' + coinsWallet + ' монет', W / 2, Math.max(60, H * 0.11));
  var next = getNextUnownedSkin();
  if (next) { var barW = Math.min(240, W * 0.65); drawProgressBar(W / 2 - barW / 2, Math.max(72, H * 0.135), barW, 20); }
  var skin = SKINS[shopIndex], isOwned = ownedSkins.has(skin.id);
  var cardW = Math.min(280, W * 0.72), cardH = Math.min(300, H * 0.48);
  var cardX = W / 2 - cardW / 2, cardY = Math.max(100, H * 0.20);

  ctx.strokeStyle = skin.bodyTop; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(cardX, cardY, cardW, cardH, 16); ctx.fill(); ctx.stroke();
  cardBtn = { x: cardX, y: cardY, w: cardW, h: cardH };
  if (!isOwned) { ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.roundRect(cardX, cardY, cardW, cardH, 16); ctx.fill(); }
  drawPlayerAt(W / 2, cardY + cardH * 0.32, Math.min(1.5, cardH / 220), skin);
  ctx.fillStyle = isOwned ? '#e0f2fe' : 'rgba(200,210,230,0.75)'; ctx.font = 'bold 20px Segoe UI, system-ui, sans-serif';
  ctx.fillText(skin.name, W / 2, cardY + cardH * 0.62);
  var statusText = '', statusColor = '#7dd3fc';
  if (selectedSkin === skin.id) { statusText = 'Выбран'; statusColor = '#4de8ff'; }
  else if (isOwned) { statusText = 'Куплен'; statusColor = '#7dff4d'; }
  else { statusText = skin.price + ' монет'; statusColor = 'rgba(255,220,100,0.95)'; }
  ctx.fillStyle = statusColor; ctx.font = '16px Segoe UI, system-ui, sans-serif'; ctx.fillText(statusText, W / 2, cardY + cardH * 0.72);
  ctx.fillStyle = 'rgba(200,220,255,0.7)'; ctx.font = '13px Segoe UI, system-ui, sans-serif';
  ctx.fillText(isOwned ? (selectedSkin === skin.id ? 'Уже выбран' : 'Enter / клик — выбрать') : 'Enter / клик — купить', W / 2, cardY + cardH * 0.82);
  if (shopMessage) {
    ctx.fillStyle = shopMessage.indexOf('Не хватает') >= 0 ? '#ff6b9d' : '#7dff4d';
    ctx.font = 'bold 15px Segoe UI, system-ui, sans-serif'; ctx.fillText(shopMessage, W / 2, cardY + cardH + 22);
  }
  var arrowSize = Math.min(48, W * 0.12);
  var leftX = Math.max(8, cardX - arrowSize - 12), rightX = Math.min(W - arrowSize - 8, cardX + cardW + 12);
  var arrowY = cardY + cardH / 2 - arrowSize / 2;
  leftBtn = { x: leftX, y: arrowY, w: arrowSize, h: arrowSize };
  ctx.fillStyle = 'rgba(40,70,120,0.85)'; ctx.beginPath(); ctx.roundRect(leftBtn.x, leftBtn.y, leftBtn.w, leftBtn.h, 10); ctx.fill();
  ctx.fillStyle = '#7dd3fc'; ctx.font = 'bold ' + Math.floor(arrowSize * 0.55) + 'px Segoe UI, system-ui, sans-serif';
  ctx.fillText('‹', leftBtn.x + arrowSize / 2, arrowY + arrowSize * 0.68);
  rightBtn = { x: rightX, y: arrowY, w: arrowSize, h: arrowSize };
  ctx.fillStyle = 'rgba(40,70,120,0.85)'; ctx.beginPath(); ctx.roundRect(rightBtn.x, rightBtn.y, rightBtn.w, rightBtn.h, 10); ctx.fill();
  ctx.fillStyle = '#7dd3fc'; ctx.fillText('›', rightBtn.x + arrowSize / 2, arrowY + arrowSize * 0.68);
  var bW = Math.min(140, W * 0.4), bH = Math.min(42, H * 0.07);
  var bX = W / 2 - bW / 2, bY = H - bH - Math.max(16, H * 0.03);
  backBtn = { x: bX, y: bY, w: bW, h: bH };
  ctx.fillStyle = 'rgba(30,50,80,0.9)'; ctx.strokeStyle = '#7dd3fc'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(bX, bY, bW, bH, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#7dd3fc'; ctx.font = 'bold 15px Segoe UI, system-ui, sans-serif'; ctx.fillText('Назад (Esc)', W / 2, bY + bH * 0.65);
}

function drawGoals() {
  drawBackground(); ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = '#4de8ff'; ctx.font = 'bold 28px Segoe UI, system-ui, sans-serif'; ctx.fillText('ЦЕЛИ', W / 2, 36);
  var tabs = ['Достижения', 'Задания дня', 'Рекорды'];
  var tabW = Math.min(110, (W - 40) / 3), tabH = 34, tabsTotal = tabW * 3 + 8, tabStartX = W / 2 - tabsTotal / 2;
  tabBtns = [];
  tabs.forEach(function(t, i) {
    var tx = tabStartX + i * (tabW + 4);
    tabBtns.push({ x: tx, y: 50, w: tabW, h: tabH });
    ctx.fillStyle = i === goalsTab ? 'rgba(40,80,140,0.95)' : 'rgba(20,35,60,0.8)';
    ctx.strokeStyle = i === goalsTab ? '#4de8ff' : 'rgba(80,120,180,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(tx, 50, tabW, tabH, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = i === goalsTab ? '#e0f2fe' : 'rgba(160,190,220,0.7)';
    ctx.font = 'bold 13px Segoe UI, system-ui, sans-serif'; ctx.fillText(t, tx + tabW / 2, 72);
  });
  var contentTop = 100, contentBottom = H - 70, contentH = contentBottom - contentTop;
  ctx.save(); ctx.beginPath(); ctx.rect(10, contentTop, W - 20, contentH); ctx.clip();
  var y = contentTop + 10 - goalsScroll;
  if (goalsTab === 0) {
    ACHIEVEMENTS.forEach(function(ach) {
      var done = unlockedAchievements.has(ach.id);
      var val = 0;
      if (ach.type === 'runScore') val = highScore;
      else if (ach.type === 'runCoins') val = stats.bestRunCoins;
      else if (ach.type === 'totalCoins') val = stats.totalCoins;
      else if (ach.type === 'totalJumps') val = stats.totalJumps;
      else if (ach.type === 'totalRuns') val = stats.totalRuns;
      else if (ach.type === 'skins') val = ownedSkins.size - 1;
      val = Math.min(val, ach.target);
      if (y + 70 > contentTop && y < contentBottom) {
        ctx.fillStyle = done ? 'rgba(20,50,35,0.85)' : 'rgba(20,30,50,0.85)';
        ctx.strokeStyle = done ? 'rgba(80,200,120,0.5)' : 'rgba(80,120,180,0.4)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.roundRect(20, y, W - 40, 64, 10); ctx.fill(); ctx.stroke();
        ctx.textAlign = 'left'; ctx.fillStyle = done ? '#7dff9a' : '#e0f2fe';
        ctx.font = 'bold 15px Segoe UI, system-ui, sans-serif'; ctx.fillText((done ? '✓ ' : '') + ach.name, 34, y + 22);
        ctx.fillStyle = 'rgba(180,200,220,0.75)'; ctx.font = '12px Segoe UI, system-ui, sans-serif'; ctx.fillText(ach.desc, 34, y + 40);
        var pw = W - 80;
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.roundRect(34, y + 48, pw, 8, 4); ctx.fill();
        ctx.fillStyle = done ? '#4ade80' : '#38bdf8'; ctx.beginPath(); ctx.roundRect(34, y + 48, pw * (val / ach.target), 8, 4); ctx.fill();
        ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(200,220,240,0.8)'; ctx.font = '11px Segoe UI, system-ui, sans-serif';
        ctx.fillText(val + ' / ' + ach.target, W - 40, y + 40);
        ctx.fillStyle = 'rgba(255,220,100,0.85)'; ctx.fillText('+' + ach.reward, W - 40, y + 22);
      }
      y += 74;
    });
  } else if (goalsTab === 1) {
    ensureDailyQuests();
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(180,200,220,0.7)'; ctx.font = '13px Segoe UI, system-ui, sans-serif';
    ctx.fillText('Сегодня: ' + dailyDate, W / 2, y + 8); y += 28;
    dailyQuests.forEach(function(q) {
      var val = Math.min(getDailyProgress(q), q.target);
      var done = q.done || val >= q.target;
      if (y + 70 > contentTop && y < contentBottom) {
        ctx.fillStyle = done ? 'rgba(20,50,35,0.85)' : 'rgba(20,30,50,0.85)';
        ctx.strokeStyle = done ? 'rgba(80,200,120,0.5)' : 'rgba(80,120,180,0.4)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.roundRect(20, y, W - 40, 64, 10); ctx.fill(); ctx.stroke();
        ctx.textAlign = 'left'; ctx.fillStyle = done ? '#7dff9a' : '#e0f2fe';
        ctx.font = 'bold 15px Segoe UI, system-ui, sans-serif'; ctx.fillText((done ? '✓ ' : '') + q.name, 34, y + 22);
        var pw = W - 80;
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.roundRect(34, y + 40, pw, 10, 5); ctx.fill();
        ctx.fillStyle = done ? '#4ade80' : '#38bdf8'; ctx.beginPath(); ctx.roundRect(34, y + 40, pw * (val / q.target), 10, 5); ctx.fill();
        ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(200,220,240,0.8)'; ctx.font = '12px Segoe UI, system-ui, sans-serif';
        ctx.fillText(val + ' / ' + q.target, W - 40, y + 22);
        ctx.fillStyle = 'rgba(255,220,100,0.85)'; ctx.fillText('+' + q.reward, W - 40, y + 54);
      }
      y += 74;
    });
  } else {
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(180,200,220,0.8)'; ctx.font = '14px Segoe UI, system-ui, sans-serif';
    ctx.fillText('Топ-5 забегов', W / 2, y + 10); y += 30;
    if (topRuns.length === 0) { ctx.fillStyle = 'rgba(150,170,200,0.6)'; ctx.fillText('Пока нет записей', W / 2, y + 30); }
    else {
      topRuns.forEach(function(r, i) {
        if (y + 50 > contentTop && y < contentBottom) {
          ctx.fillStyle = i === 0 ? 'rgba(40,35,15,0.9)' : 'rgba(20,30,50,0.85)';
          ctx.strokeStyle = i === 0 ? 'rgba(255,200,50,0.5)' : 'rgba(80,120,180,0.4)'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.roundRect(20, y, W - 40, 44, 10); ctx.fill(); ctx.stroke();
          ctx.textAlign = 'left'; ctx.fillStyle = i === 0 ? '#ffe566' : '#e0f2fe';
          ctx.font = 'bold 16px Segoe UI, system-ui, sans-serif'; ctx.fillText('#' + (i + 1), 36, y + 28);
          ctx.fillStyle = '#e0f2fe'; ctx.fillText('' + r.score, 80, y + 28);
          ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(180,200,220,0.75)'; ctx.font = '13px Segoe UI, system-ui, sans-serif';
          ctx.fillText(r.date, W - 40, y + 28);
        }
        y += 52;
      });
    }
    y += 16; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(160,190,220,0.7)'; ctx.font = '13px Segoe UI, system-ui, sans-serif';
    ['Всего забегов: ' + stats.totalRuns, 'Всего прыжков: ' + stats.totalJumps, 'Всего монет: ' + stats.totalCoins,
     'Лучший сбор монет: ' + stats.bestRunCoins, 'Лучший мир: ' + (stats.bestWorld + 1) + ' (' + (WORLDS[stats.bestWorld] ? WORLDS[stats.bestWorld].name : '—') + ')'].forEach(function(line) {
      if (y > contentTop && y < contentBottom) ctx.fillText(line, 30, y); y += 22;
    });
  }
  ctx.restore();
  var bW = Math.min(140, W * 0.4), bH = Math.min(42, H * 0.07);
  var bX = W / 2 - bW / 2, bY = H - bH - Math.max(12, H * 0.025);
  backBtn = { x: bX, y: bY, w: bW, h: bH };
  ctx.fillStyle = 'rgba(30,50,80,0.9)'; ctx.strokeStyle = '#7dd3fc'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(bX, bY, bW, bH, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#7dd3fc'; ctx.font = 'bold 15px Segoe UI, system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('Назад (Esc)', W / 2, bY + bH * 0.65);
  drawNotifications();
}

function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  var dt = Math.min(0.05, (timestamp - lastTime) / 1000); lastTime = timestamp;
  if (state === 'playing' || state === 'shop' || state === 'goals') update(dt);
  if (state === 'start') drawStartScreen();
  else if (state === 'shop') drawShop();
  else if (state === 'goals') drawGoals();
  else { drawBackground(); drawObstacles(); drawCoins(); drawPlayer(); drawParticles(); drawUI(); if (state === 'gameover') drawGameOver(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
